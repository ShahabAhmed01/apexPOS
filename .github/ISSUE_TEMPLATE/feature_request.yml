name: Feature Request
description: Suggest a new feature or improvement for APEXPOS
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for APEXPOS! Please describe the problem you're trying to solve and your proposed solution.

  - type: textarea
    attributes:
      label: Problem
      description: What problem are you trying to solve? How does it affect your workflow?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: What would you like to see implemented?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Expected benefit
      description: Who would benefit and how?
    validations:
      required: false
