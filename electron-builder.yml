appId: com.apexpos.app
productName: APEXPOS
copyright: Copyright © 2026
asar: true
asarUnpack:
  - '**/*.node'
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
npmRebuild: false
extends: null
# Note: electron-builder does NOT expand "~" — a literal directory would be
# created inside the project. Leave the default cache (~/.cache/electron at
# the OS level) unless a CI override is truly needed.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: APEXPOS
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  maintainer: APEXPOS Project
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.png
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.finance
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.png
publish: null
